version: '3.8'
services:
  postgres1:
    image: postgres:15
    container_name: KRIZOVATKA_DB
    environment:
      POSTGRES_DB: KRIZOVATKA_DB
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres1_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    container_name: KRIZOVATKA_API
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres1

volumes:
  postgres1_data: